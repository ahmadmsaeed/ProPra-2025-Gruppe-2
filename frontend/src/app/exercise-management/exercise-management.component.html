<div class="container">
  <div class="header">
    <h1>Übungsverwaltung</h1>
    <div class="header-actions">
      <button mat-raised-button color="primary" [matMenuTriggerFor]="createMenu">
        <mat-icon>add</mat-icon>
        Neue Übung
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      
      <mat-menu #createMenu="matMenu">
        <button mat-menu-item (click)="openCreateDialog()">
          <mat-icon>edit</mat-icon>
          <span>Manuell erstellen</span>
        </button>
        <button mat-menu-item (click)="openGenerateDialog()">
          <mat-icon>auto_awesome</mat-icon>
          <span>Mit KI generieren</span>
        </button>
      </mat-menu>
    </div>
  </div>

  <div class="exercises-list">
    <mat-card *ngFor="let exercise of exercises" class="exercise-card">
      <mat-card-header>
        <mat-card-title>{{ exercise.title }}</mat-card-title>
        <mat-card-subtitle>
          Autor: {{ exercise.author.name }} | 
          Datenbank: {{ exercise.database.name }}
        </mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <p>{{ exercise.description }}</p>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-icon-button color="primary" (click)="openViewDialog(exercise)">
          <mat-icon>visibility</mat-icon>
        </button>
        
        <button mat-icon-button color="accent" 
                *ngIf="canEdit(exercise)"
                (click)="openEditDialog(exercise)">
          <mat-icon>edit</mat-icon>
        </button>
        
        <button mat-icon-button color="warn" 
                *ngIf="canEdit(exercise)"
                (click)="deleteExercise(exercise)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>

    <!-- No exercises message -->
    <div *ngIf="exercises.length === 0" class="no-exercises">
      <mat-icon>assignment</mat-icon>
      <h2>Keine Übungen verfügbar</h2>
      <p>Erstellen Sie eine neue Übung, um loszulegen.</p>
    </div>
  </div>
</div>
